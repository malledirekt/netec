<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 120 780 850" role="img" aria-labelledby="t">
  <title id="t">Ventana abierta al Mediterráneo con mosquitera plisada Netec</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6ee"/>
      <stop offset=".55" stop-color="#f3ecd9"/>
      <stop offset="1" stop-color="#f7dcb4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa7b8"/>
      <stop offset="1" stop-color="#2f7d92"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#ece9df"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".6" stop-color="#ffe7a6"/>
      <stop offset="1" stop-color="#ffe7a6" stop-opacity="0"/>
    </radialGradient>
    <!-- feines Gewebe -->
    <pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 .5H6M.5 0V6" stroke="#2b3136" stroke-width=".8" stroke-opacity=".3"/>
    </pattern>
    <!-- Plissee-Falten -->
    <pattern id="pleat" width="44" height="10" patternUnits="userSpaceOnUse">
      <rect width="22" height="10" fill="#000" fill-opacity=".06"/>
      <rect x="22" width="22" height="10" fill="#fff" fill-opacity=".08"/>
      <path d="M22 0V10" stroke="#000" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <clipPath id="opening"><rect x="190" y="200" width="580" height="680" rx="6"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3b4a2a" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Wand -->
  <rect width="960" height="1080" fill="url(#wall)"/>

  <!-- Fensterleibung -->
  <rect x="150" y="160" width="660" height="760" rx="18" fill="#e3dfd2"/>
  <rect x="170" y="180" width="620" height="720" rx="12" fill="#d8d3c3"/>

  <!-- Blick nach draußen -->
  <g clip-path="url(#opening)">
    <rect x="190" y="200" width="580" height="680" fill="url(#sky)"/>
    <circle cx="610" cy="470" r="130" fill="url(#sun)"/>
    <circle cx="610" cy="470" r="44" fill="#fff3cf"/>
    <!-- Küstenlinie / Tramuntana -->
    <path d="M190 560 L250 520 L300 535 L360 488 L420 515 L470 498 L520 530 L580 520 L640 545 L700 528 L770 552 V600 H190Z" fill="#9db6a3" opacity=".75"/>
    <path d="M190 585 L260 565 L330 575 L400 556 L470 572 L560 566 L650 580 L770 570 V610 H190Z" fill="#7f9f88" opacity=".85"/>
    <rect x="190" y="600" width="580" height="280" fill="url(#sea)"/>
    <g stroke="#fff" stroke-linecap="round" stroke-opacity=".55" stroke-width="3">
      <path d="M560 640h90M600 668h60M520 700h50M640 720h70M330 650h60M260 690h80M380 730h50"/>
    </g>
    <!-- Segelboot -->
    <path d="M330 628 l26 -58 v58z" fill="#fff"/>
    <path d="M318 630 h48 l-8 10 h-34z" fill="#2b3136" opacity=".7"/>
    <!-- Kiefernzweig -->
    <g fill="#5f7d3a">
      <path d="M190 260 C 260 270 320 300 360 350" stroke="#6b5233" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g opacity=".95">
        <ellipse cx="250" cy="262" rx="46" ry="16" transform="rotate(-12 250 262)"/>
        <ellipse cx="300" cy="300" rx="44" ry="15" transform="rotate(22 300 300)"/>
        <ellipse cx="340" cy="332" rx="38" ry="13" transform="rotate(48 340 332)"/>
        <ellipse cx="226" cy="290" rx="40" ry="13" transform="rotate(14 226 290)"/>
      </g>
    </g>
    <!-- Terrakotta-Topf auf der Brüstung -->
    <g>
      <path d="M232 830 h96 l-12 50 h-72z" fill="#c8754a"/>
      <rect x="226" y="820" width="108" height="16" rx="4" fill="#d98a5d"/>
      <g fill="#7ab51d">
        <path d="M280 822 C 270 770 240 750 226 742 C 262 752 280 780 286 820z"/>
        <path d="M282 822 C 292 760 320 735 342 726 C 312 748 296 780 290 822z"/>
        <path d="M278 822 C 276 790 262 770 250 760 C 272 770 284 792 286 822z" fill="#5f9113"/>
      </g>
      <g fill="#c2406f">
        <circle cx="232" cy="742" r="9"/><circle cx="344" cy="725" r="9"/><circle cx="252" cy="758" r="7"/>
      </g>
    </g>
  </g>

  <!-- Plissee-Insektenschutz (rechte Hälfte, halb aufgezogen) -->
  <g>
    <rect x="452" y="200" width="318" height="680" fill="url(#mesh)"/>
    <rect x="452" y="200" width="318" height="680" fill="#ffffff" fill-opacity=".10"/>
    <rect x="452" y="200" width="318" height="680" fill="url(#pleat)"/>
    <!-- Bedienprofil -->
    <rect x="440" y="196" width="18" height="688" rx="4" fill="#3a4045"/>
    <rect x="445" y="500" width="8" height="90" rx="4" fill="#7ab51d"/>
    <!-- Mücke draußen, bleibt draußen -->
    <g transform="translate(600 360) rotate(-18)" stroke="#2b3136" stroke-linecap="round" fill="none">
      <ellipse cx="0" cy="0" rx="16" ry="5" fill="#2b3136" stroke="none"/>
      <circle cx="-19" cy="-1" r="5" fill="#2b3136" stroke="none"/>
      <path d="M-23 0 l-16 4" stroke-width="1.6"/>
      <path d="M-6 3 l-10 22 M2 4 l-2 26 M10 3 l10 24" stroke-width="1.6"/>
      <path d="M-2 -3 C -12 -30 -34 -34 -30 -18 C -26 -10 -10 -6 -2 -3z" fill="#ffffff" fill-opacity=".75" stroke-width="1.2"/>
      <path d="M2 -3 C 6 -32 30 -38 28 -22 C 26 -12 10 -6 2 -3z" fill="#ffffff" fill-opacity=".75" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Fensterrahmen + Flügel -->
  <g fill="none" stroke="#fdfdfb" stroke-linejoin="round">
    <rect x="182" y="192" width="596" height="696" rx="8" stroke-width="18"/>
  </g>
  <rect x="190" y="200" width="580" height="680" rx="6" fill="none" stroke="#c9c3b2" stroke-width="2"/>

  <!-- Fensterbank -->
  <rect x="120" y="896" width="720" height="34" rx="8" fill="#f2efe6" filter="url(#soft)"/>
  <rect x="120" y="924" width="720" height="8" rx="4" fill="#d6d0c0"/>
</svg>
